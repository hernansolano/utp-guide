name: utp_guide
description: "Navegación interior inclusiva para FISC-UTP. Piloto tercer piso."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9
  go_router: ^13.0.0
  sensors_plus: ^4.0.2
  google_fonts: ^6.2.1
  # Versiones pineadas exactas tras auditoría de seguridad (ADR-0009):
  # paquetes con código nativo y permisos de sistema. No subir sin
  # revisar changelog y rehacer auditoría.
  flutter_blue_plus: 1.36.8
  permission_handler: 11.4.0
  flutter_tts: 4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/grafo.json
    - assets/data/beacon_config.json
    - assets/maps/
    - assets/models/
