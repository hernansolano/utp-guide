<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Aula de prueba — UTP-Guide piloto

  Plano arquitectónico simplificado de un aula real (medido a mano
  el 2026-06-04). El cuarto físico tiene pequeños jogs y
  notches en las 4 esquinas (columnas estructurales); aquí se simplifican
  a rectángulos grises de 0.5 × 0.5 m para señalizarlas sin complicar el
  polígono de navegación.

  Escala     : 100 px = 1 m (ADR-0006)
  ViewBox    : 0 0 804 729  (8.04 × 7.29 m)
  Origen     : esquina superior izquierda, Y positiva hacia abajo
  Paredes    : 15 cm de espesor (concreto)
  Puerta P-01: pared norte, x = 0.92 .. 1.82 m, ancho 0.90 m

  Balizas (montadas en pared, antena hacia el interior del cuarto):
    B-01 — Minor 1 — (0.00, 0.50) m — pared OESTE
    B-02 — Minor 2 — (8.04, 0.50) m — pared ESTE
    B-03 — Minor 3 — (4.02, 7.29) m — pared SUR, centrada
    Altura de montaje: 2.50 m sobre el piso (sobre marco de puertas).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 804 729"
     width="804"
     height="729">

  <!-- ────────────────────────────────────────────────────────────
       Capa 1 — Piso (fondo)
       ──────────────────────────────────────────────────────────── -->
  <rect x="0" y="0" width="804" height="729" fill="#F8F7F2"/>

  <!-- ────────────────────────────────────────────────────────────
       Capa 2 — Grid de referencia métrica (cada 1 m)
       ──────────────────────────────────────────────────────────── -->
  <g id="grid" stroke="#C9C6BC" stroke-width="0.5"
     stroke-dasharray="2 4" opacity="0.55">
    <!-- Verticales -->
    <line x1="100" y1="15" x2="100" y2="714"/>
    <line x1="200" y1="15" x2="200" y2="714"/>
    <line x1="300" y1="15" x2="300" y2="714"/>
    <line x1="400" y1="15" x2="400" y2="714"/>
    <line x1="500" y1="15" x2="500" y2="714"/>
    <line x1="600" y1="15" x2="600" y2="714"/>
    <line x1="700" y1="15" x2="700" y2="714"/>
    <!-- Horizontales -->
    <line x1="15" y1="100" x2="789" y2="100"/>
    <line x1="15" y1="200" x2="789" y2="200"/>
    <line x1="15" y1="300" x2="789" y2="300"/>
    <line x1="15" y1="400" x2="789" y2="400"/>
    <line x1="15" y1="500" x2="789" y2="500"/>
    <line x1="15" y1="600" x2="789" y2="600"/>
    <line x1="15" y1="700" x2="789" y2="700"/>
  </g>

  <!-- ────────────────────────────────────────────────────────────
       Capa 3 — Paredes (15 px = 15 cm)
       ──────────────────────────────────────────────────────────── -->
  <g id="walls" fill="#26261F">
    <!-- Pared norte (con apertura para P-01 en x = 92 .. 182) -->
    <rect x="0"   y="0"   width="92"  height="15"/>
    <rect x="182" y="0"   width="622" height="15"/>
    <!-- Pared sur -->
    <rect x="0"   y="714" width="804" height="15"/>
    <!-- Pared oeste -->
    <rect x="0"   y="15"  width="15"  height="699"/>
    <!-- Pared este -->
    <rect x="789" y="15"  width="15"  height="699"/>
  </g>

  <!-- ────────────────────────────────────────────────────────────
       Capa 4 — Columnas estructurales (simplificadas)
       Rectángulos grises en las 4 esquinas interiores indicando
       presencia de columnas/jogs en el cuarto real.
       ──────────────────────────────────────────────────────────── -->
  <g id="columns" fill="#B8B5AC" opacity="0.6">
    <!-- NW -->
    <rect x="15"  y="15"  width="50" height="50"/>
    <!-- NE -->
    <rect x="739" y="15"  width="50" height="50"/>
    <!-- SW -->
    <rect x="15"  y="664" width="50" height="50"/>
    <!-- SE -->
    <rect x="739" y="664" width="50" height="50"/>
  </g>

  <!-- ────────────────────────────────────────────────────────────
       Capa 5 — Dimensiones (estilo arquitectónico)
       ──────────────────────────────────────────────────────────── -->
  <g id="dimensions" stroke="#3A3A36" stroke-width="0.6" fill="#222"
     font-family="Arial, Helvetica, sans-serif" font-size="11"
     font-weight="600">

    <!-- ── Dimensión horizontal "8.04 m" (al norte, justo bajo pared) ── -->
    <line x1="15"  y1="15" x2="15"  y2="50"/>
    <line x1="789" y1="15" x2="789" y2="50"/>
    <line x1="15"  y1="40" x2="789" y2="40"/>
    <line x1="11"  y1="36" x2="19"  y2="44"/>
    <line x1="785" y1="36" x2="793" y2="44"/>
    <rect x="374" y="33" width="56" height="14" fill="#F8F7F2" stroke="none"/>
    <text x="402" y="43" text-anchor="middle" stroke="none">8.04 m</text>

    <!-- ── Dimensión vertical "7.29 m" (al este) ── -->
    <line x1="789" y1="15"  x2="754" y2="15"/>
    <line x1="789" y1="714" x2="754" y2="714"/>
    <line x1="764" y1="15"  x2="764" y2="714"/>
    <line x1="760" y1="11"  x2="768" y2="19"/>
    <line x1="760" y1="710" x2="768" y2="718"/>
    <rect x="754" y="337" width="20" height="56" fill="#F8F7F2" stroke="none"/>
    <text x="764" y="367" text-anchor="middle" stroke="none"
          transform="rotate(-90, 764, 367)">7.29 m</text>
  </g>

  <!-- ────────────────────────────────────────────────────────────
       Capa 6 — Puerta P-01 (sin arco de apertura)
       ──────────────────────────────────────────────────────────── -->
  <g id="door">
    <!-- Jambas en los bordes de la apertura -->
    <line x1="92"  y1="11" x2="92"  y2="22" stroke="#26261F" stroke-width="2"/>
    <line x1="182" y1="11" x2="182" y2="22" stroke="#26261F" stroke-width="2"/>
  </g>

  <!-- ────────────────────────────────────────────────────────────
       Capa 7 — Balizas BLE
       Cada beacon pegado a su pared, ondas hacia interior del cuarto.
       ──────────────────────────────────────────────────────────── -->
  <g id="beacons" font-family="Arial, Helvetica, sans-serif">

    <!-- ── B-01 · Minor 1 · pared OESTE · (0.0, 0.5) m → (0, 50) px ── -->
    <g transform="translate(0, 50)">
      <!-- Dispositivo pegado a pared oeste (interior del cuarto) -->
      <rect x="15" y="-4" width="5" height="8" rx="1" fill="#1B5470"/>
      <!-- Ondas (transmisión hacia el este, dentro del cuarto) -->
      <path d="M 27 -7 A 7 7 0 0 1 27 7" stroke="#1B5470" stroke-width="1.2" fill="none"/>
      <path d="M 25 -4 A 4 4 0 0 1 25 4" stroke="#1B5470" stroke-width="1.2" fill="none"/>
      <!-- Etiqueta a la derecha (dentro del cuarto) -->
      <rect x="32" y="-11" width="38" height="22" rx="2"
            fill="#F8F7F2" opacity="0.92" stroke="#1B5470" stroke-width="0.4"/>
      <text x="51" y="0" font-size="9" font-weight="700"
            fill="#1B5470" text-anchor="middle">B-01</text>
      <text x="51" y="8" font-size="7" font-weight="500"
            fill="#666" text-anchor="middle">h 2.50 m</text>
    </g>

    <!-- ── B-02 · Minor 2 · pared ESTE · (8.04, 0.5) m → (804, 50) px ── -->
    <g transform="translate(804, 50)">
      <!-- Dispositivo pegado a pared este -->
      <rect x="-20" y="-4" width="5" height="8" rx="1" fill="#1B5470"/>
      <!-- Ondas (transmisión hacia el oeste, dentro del cuarto) -->
      <path d="M -27 -7 A 7 7 0 0 0 -27 7" stroke="#1B5470" stroke-width="1.2" fill="none"/>
      <path d="M -25 -4 A 4 4 0 0 0 -25 4" stroke="#1B5470" stroke-width="1.2" fill="none"/>
      <!-- Etiqueta a la izquierda (dentro del cuarto) -->
      <rect x="-70" y="-11" width="38" height="22" rx="2"
            fill="#F8F7F2" opacity="0.92" stroke="#1B5470" stroke-width="0.4"/>
      <text x="-51" y="0" font-size="9" font-weight="700"
            fill="#1B5470" text-anchor="middle">B-02</text>
      <text x="-51" y="8" font-size="7" font-weight="500"
            fill="#666" text-anchor="middle">h 2.50 m</text>
    </g>

    <!-- ── B-03 · Minor 3 · pared SUR · (4.02, 7.29) m → (402, 729) px ── -->
    <g transform="translate(402, 729)">
      <!-- Dispositivo pegado a pared sur -->
      <rect x="-4" y="-20" width="8" height="5" rx="1" fill="#1B5470"/>
      <!-- Ondas (transmisión hacia el norte, dentro del cuarto) -->
      <path d="M -7 -27 A 7 7 0 0 1 7 -27" stroke="#1B5470" stroke-width="1.2" fill="none"/>
      <path d="M -4 -25 A 4 4 0 0 1 4 -25" stroke="#1B5470" stroke-width="1.2" fill="none"/>
      <!-- Etiqueta arriba (dentro del cuarto) -->
      <rect x="-19" y="-54" width="38" height="22" rx="2"
            fill="#F8F7F2" opacity="0.92" stroke="#1B5470" stroke-width="0.4"/>
      <text x="0" y="-43" font-size="9" font-weight="700"
            fill="#1B5470" text-anchor="middle">B-03</text>
      <text x="0" y="-35" font-size="7" font-weight="500"
            fill="#666" text-anchor="middle">h 2.50 m</text>
    </g>
  </g>

</svg>
