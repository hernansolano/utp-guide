<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Cuarto de prueba 5 × 5 m — UTP-Guide piloto

  Plano arquitectónico simplificado para validar el sistema BLE
  (calibración, trilateración, snap-to-graph y navegación A*).

  Escala     : 100 px = 1 m (ADR-0006)
  ViewBox    : 0 0 500 500  (5.00 m × 5.00 m)
  Origen     : esquina superior izquierda, Y positiva hacia abajo
  Paredes    : 15 cm de espesor (concreto típico interior)
  Puerta P-01: pared sur, 1.00 m de ancho, sin arco de apertura

  Balizas (montadas en pared, antena hacia el interior del cuarto):
    B-01 — Minor 1 — (0.5, 0.0) m — pared norte, 0.5 m al este del NO
    B-02 — Minor 2 — (4.5, 0.0) m — pared norte, 0.5 m al oeste del NE
    B-03 — Minor 3 — (2.5, 5.0) m — pared sur, centrado
    Altura de montaje: 2.50 m sobre el piso (sobre marco de puertas).

  Nota sobre el modelo de path-loss (ver docs/positioning-ble.md):
    El modelo es 2D. La altura del beacon (2.5 m) vs altura del teléfono
    (~1.5 m) introduce un sesgo sistemático en distancias cortas.
    Despreciable para distancias horizontales > 2 m.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 500"
     width="500"
     height="500">

  <!-- ────────────────────────────────────────────────────────────
       Capa 1 — Piso (fondo)
       ──────────────────────────────────────────────────────────── -->
  <rect x="0" y="0" width="500" height="500" fill="#F8F7F2"/>

  <!-- ────────────────────────────────────────────────────────────
       Capa 2 — Grid de referencia métrica (cada 1 m)
       ──────────────────────────────────────────────────────────── -->
  <g id="grid" stroke="#C9C6BC" stroke-width="0.5"
     stroke-dasharray="2 4" opacity="0.55">
    <line x1="100" y1="15"  x2="100" y2="485"/>
    <line x1="200" y1="15"  x2="200" y2="485"/>
    <line x1="300" y1="15"  x2="300" y2="485"/>
    <line x1="400" y1="15"  x2="400" y2="485"/>
    <line x1="15"  y1="100" x2="485" y2="100"/>
    <line x1="15"  y1="200" x2="485" y2="200"/>
    <line x1="15"  y1="300" x2="485" y2="300"/>
    <line x1="15"  y1="400" x2="485" y2="400"/>
  </g>

  <!-- ────────────────────────────────────────────────────────────
       Capa 3 — Paredes (15 px = 15 cm)
       ──────────────────────────────────────────────────────────── -->
  <g id="walls" fill="#26261F">
    <!-- Pared norte -->
    <rect x="0"   y="0"   width="500" height="15"/>
    <!-- Pared sur (con apertura para P-01 en x=200..300) -->
    <rect x="0"   y="485" width="200" height="15"/>
    <rect x="300" y="485" width="200" height="15"/>
    <!-- Pared oeste -->
    <rect x="0"   y="15"  width="15"  height="470"/>
    <!-- Pared este -->
    <rect x="485" y="15"  width="15"  height="470"/>
  </g>

  <!-- ────────────────────────────────────────────────────────────
       Capa 4 — Dimensiones (estilo arquitectónico)
       ──────────────────────────────────────────────────────────── -->
  <g id="dimensions" stroke="#3A3A36" stroke-width="0.6" fill="#222"
     font-family="Arial, Helvetica, sans-serif" font-size="11"
     font-weight="600">

    <!-- ── Dimensión horizontal "5.00 m" (al norte, justo bajo pared) ── -->
    <line x1="15"  y1="15" x2="15"  y2="40"/>
    <line x1="485" y1="15" x2="485" y2="40"/>
    <line x1="15"  y1="32" x2="485" y2="32"/>
    <line x1="11"  y1="28" x2="19"  y2="36"/>
    <line x1="481" y1="28" x2="489" y2="36"/>
    <rect x="222" y="25" width="56" height="14" fill="#F8F7F2" stroke="none"/>
    <text x="250" y="35" text-anchor="middle" stroke="none">5.00 m</text>

    <!-- ── Dimensión vertical "5.00 m" (al este) ── -->
    <line x1="485" y1="15"  x2="460" y2="15"/>
    <line x1="485" y1="485" x2="460" y2="485"/>
    <line x1="468" y1="15"  x2="468" y2="485"/>
    <line x1="464" y1="11"  x2="472" y2="19"/>
    <line x1="464" y1="481" x2="472" y2="489"/>
    <rect x="458" y="222" width="20" height="56" fill="#F8F7F2" stroke="none"/>
    <text x="468" y="252" text-anchor="middle" stroke="none"
          transform="rotate(-90, 468, 252)">5.00 m</text>
  </g>

  <!-- ────────────────────────────────────────────────────────────
       Capa 5 — Puerta P-01 (sin arco de apertura)
       ──────────────────────────────────────────────────────────── -->
  <g id="door">
    <!-- Jambas en los bordes de la apertura -->
    <line x1="200" y1="481" x2="200" y2="492" stroke="#26261F" stroke-width="2"/>
    <line x1="300" y1="481" x2="300" y2="492" stroke="#26261F" stroke-width="2"/>
  </g>

  <!-- ────────────────────────────────────────────────────────────
       Capa 6 — Balizas BLE
       Convención visual:
         - Dispositivo: rectángulo pequeño teal, pegado al borde interior
           de la pared (representa el cuerpo del beacon Minew E2 Max).
         - Ondas: dos arcos cortos saliendo hacia el interior del cuarto.
         - Etiqueta: código (B-XX) + altura de montaje (h 2.50 m).
       ──────────────────────────────────────────────────────────── -->
  <g id="beacons" font-family="Arial, Helvetica, sans-serif">

    <!-- ── B-01 · Minor 1 · pared NORTE · (0.5, 0.0) m → (50, 0) px ── -->
    <g transform="translate(50, 0)">
      <!-- Dispositivo pegado a pared norte (interior del cuarto) -->
      <rect x="-4" y="15" width="8" height="5" rx="1" fill="#1B5470"/>
      <!-- Ondas (transmisión hacia el sur, dentro del cuarto) -->
      <path d="M -7 27 A 7 7 0 0 0 7 27" stroke="#1B5470" stroke-width="1.2" fill="none"/>
      <path d="M -4 25 A 4 4 0 0 0 4 25" stroke="#1B5470" stroke-width="1.2" fill="none"/>
      <!-- Etiqueta debajo -->
      <rect x="-19" y="32" width="38" height="22" rx="2"
            fill="#F8F7F2" opacity="0.92" stroke="#1B5470" stroke-width="0.4"/>
      <text x="0" y="43" font-size="9" font-weight="700"
            fill="#1B5470" text-anchor="middle">B-01</text>
      <text x="0" y="51" font-size="7" font-weight="500"
            fill="#666" text-anchor="middle">h 2.50 m</text>
    </g>

    <!-- ── B-02 · Minor 2 · pared NORTE · (4.5, 0.0) m → (450, 0) px ── -->
    <g transform="translate(450, 0)">
      <rect x="-4" y="15" width="8" height="5" rx="1" fill="#1B5470"/>
      <path d="M -7 27 A 7 7 0 0 0 7 27" stroke="#1B5470" stroke-width="1.2" fill="none"/>
      <path d="M -4 25 A 4 4 0 0 0 4 25" stroke="#1B5470" stroke-width="1.2" fill="none"/>
      <rect x="-19" y="32" width="38" height="22" rx="2"
            fill="#F8F7F2" opacity="0.92" stroke="#1B5470" stroke-width="0.4"/>
      <text x="0" y="43" font-size="9" font-weight="700"
            fill="#1B5470" text-anchor="middle">B-02</text>
      <text x="0" y="51" font-size="7" font-weight="500"
            fill="#666" text-anchor="middle">h 2.50 m</text>
    </g>

    <!-- ── B-03 · Minor 3 · pared SUR · (2.5, 5.0) m → (250, 500) px ── -->
    <g transform="translate(250, 500)">
      <!-- Dispositivo pegado a pared sur (interior del cuarto) -->
      <rect x="-4" y="-20" width="8" height="5" rx="1" fill="#1B5470"/>
      <!-- Ondas (transmisión hacia el norte, dentro del cuarto) -->
      <path d="M -7 -27 A 7 7 0 0 1 7 -27" stroke="#1B5470" stroke-width="1.2" fill="none"/>
      <path d="M -4 -25 A 4 4 0 0 1 4 -25" stroke="#1B5470" stroke-width="1.2" fill="none"/>
      <!-- Etiqueta arriba -->
      <rect x="-19" y="-54" width="38" height="22" rx="2"
            fill="#F8F7F2" opacity="0.92" stroke="#1B5470" stroke-width="0.4"/>
      <text x="0" y="-43" font-size="9" font-weight="700"
            fill="#1B5470" text-anchor="middle">B-03</text>
      <text x="0" y="-35" font-size="7" font-weight="500"
            fill="#666" text-anchor="middle">h 2.50 m</text>
    </g>
  </g>

</svg>
