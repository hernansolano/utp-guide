<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">

  <!-- Metadatos del mapa para la app -->
  <!-- mapa_ancho_metros: 5.0 -->
  <!-- mapa_alto_metros: 5.0 -->
  <!-- escala: 100px = 1 metro -->
  <!-- origen: esquina superior izquierda (0,0) -->

  <!-- Fondo del cuarto -->
  <rect x="0" y="0" width="500" height="500" fill="#F5F5F0"/>

  <!-- Paredes (borde exterior) -->
  <rect x="10" y="10" width="480" height="480"
        fill="none" stroke="#2C2C2A" stroke-width="8" rx="4"/>

  <!-- Puerta de entrada (sur, centrada) - apertura de 1m = 100px -->
  <!-- La puerta va de x=200 a x=300 en y=490 -->
  <line x1="200" y1="490" x2="300" y2="490"
        stroke="#F5F5F0" stroke-width="10"/>
  <!-- Arco de apertura de puerta -->
  <path d="M200 490 Q200 410 300 490"
        fill="none" stroke="#2C2C2A" stroke-width="1.5"
        stroke-dasharray="4 3"/>
  <!-- Indicador de puerta -->
  <line x1="200" y1="490" x2="300" y2="490"
        stroke="#888780" stroke-width="2"/>

  <!-- Grid de referencia métrico (líneas cada 1 metro = 100px) -->
  <!-- Líneas verticales -->
  <line x1="110" y1="10" x2="110" y2="490"
        stroke="#CCCCCC" stroke-width="0.5" stroke-dasharray="3 4"/>
  <line x1="210" y1="10" x2="210" y2="490"
        stroke="#CCCCCC" stroke-width="0.5" stroke-dasharray="3 4"/>
  <line x1="310" y1="10" x2="310" y2="490"
        stroke="#CCCCCC" stroke-width="0.5" stroke-dasharray="3 4"/>
  <line x1="410" y1="10" x2="410" y2="490"
        stroke="#CCCCCC" stroke-width="0.5" stroke-dasharray="3 4"/>
  <!-- Líneas horizontales -->
  <line x1="10" y1="110" x2="490" y2="110"
        stroke="#CCCCCC" stroke-width="0.5" stroke-dasharray="3 4"/>
  <line x1="10" y1="210" x2="490" y2="210"
        stroke="#CCCCCC" stroke-width="0.5" stroke-dasharray="3 4"/>
  <line x1="10" y1="310" x2="490" y2="310"
        stroke="#CCCCCC" stroke-width="0.5" stroke-dasharray="3 4"/>
  <line x1="10" y1="410" x2="490" y2="410"
        stroke="#CCCCCC" stroke-width="0.5" stroke-dasharray="3 4"/>

  <!-- Etiquetas métricas (ejes) -->
  <!-- Eje X (metros horizontales) -->
  <text x="60"  y="508" font-size="11" fill="#888780"
        text-anchor="middle" font-family="sans-serif">0m</text>
  <text x="160" y="508" font-size="11" fill="#888780"
        text-anchor="middle" font-family="sans-serif">1m</text>
  <text x="260" y="508" font-size="11" fill="#888780"
        text-anchor="middle" font-family="sans-serif">2m</text>
  <text x="360" y="508" font-size="11" fill="#888780"
        text-anchor="middle" font-family="sans-serif">3m</text>
  <text x="460" y="508" font-size="11" fill="#888780"
        text-anchor="middle" font-family="sans-serif">4m</text>

  <!-- Eje Y (metros verticales) -->
  <text x="5" y="65"  font-size="11" fill="#888780"
        text-anchor="middle" font-family="sans-serif">0</text>
  <text x="5" y="165" font-size="11" fill="#888780"
        text-anchor="middle" font-family="sans-serif">1</text>
  <text x="5" y="265" font-size="11" fill="#888780"
        text-anchor="middle" font-family="sans-serif">2</text>
  <text x="5" y="365" font-size="11" fill="#888780"
        text-anchor="middle" font-family="sans-serif">3</text>
  <text x="5" y="465" font-size="11" fill="#888780"
        text-anchor="middle" font-family="sans-serif">4</text>

  <!-- Nodos de navegación (posiciones del grafo.json de prueba) -->
  <!-- N1: Entrada (2.5, 4.5) → px (260, 460) -->
  <circle id="node-entrada" cx="260" cy="460" r="6"
          fill="#1D9E75" stroke="white" stroke-width="2"/>
  <text x="280" y="464" font-size="10" fill="#1D9E75"
        font-family="sans-serif" font-weight="500">Entrada</text>

  <!-- N2: Centro (2.5, 2.5) → px (260, 260) -->
  <circle id="node-centro" cx="260" cy="260" r="6"
          fill="#1D9E75" stroke="white" stroke-width="2"/>
  <text x="270" y="255" font-size="10" fill="#1D9E75"
        font-family="sans-serif" font-weight="500">Centro</text>

  <!-- N3: Esquina NO (0.5, 0.5) → px (60, 60) -->
  <circle id="node-esquina-no" cx="60" cy="60" r="6"
          fill="#1D9E75" stroke="white" stroke-width="2"/>
  <text x="72" y="64" font-size="10" fill="#1D9E75"
        font-family="sans-serif" font-weight="500">Esq. NO</text>

  <!-- N4: Esquina NE (4.5, 0.5) → px (460, 60) -->
  <circle id="node-esquina-ne" cx="460" cy="60" r="6"
          fill="#1D9E75" stroke="white" stroke-width="2"/>
  <text x="400" y="55" font-size="10" fill="#1D9E75"
        font-family="sans-serif" font-weight="500">Esq. NE</text>

  <!-- N5: Esquina SO (0.5, 4.5) → px (60, 460) -->
  <circle id="node-esquina-so" cx="60" cy="460" r="6"
          fill="#1D9E75" stroke="white" stroke-width="2"/>
  <text x="72" y="464" font-size="10" fill="#1D9E75"
        font-family="sans-serif" font-weight="500">Esq. SO</text>

  <!-- N6: Esquina SE (4.5, 4.5) → px (460, 460) -->
  <circle id="node-esquina-se" cx="460" cy="460" r="6"
          fill="#1D9E75" stroke="white" stroke-width="2"/>
  <text x="390" y="474" font-size="10" fill="#1D9E75"
        font-family="sans-serif" font-weight="500">Esq. SE</text>

  <!-- Aristas del grafo (conexiones entre nodos) -->
  <line x1="260" y1="460" x2="260" y2="260"
        stroke="#1D9E75" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <line x1="260" y1="260" x2="60"  y2="60"
        stroke="#1D9E75" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <line x1="260" y1="260" x2="460" y2="60"
        stroke="#1D9E75" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <line x1="260" y1="260" x2="60"  y2="460"
        stroke="#1D9E75" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <line x1="260" y1="260" x2="460" y2="460"
        stroke="#1D9E75" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- Posiciones de beacons BLE de prueba (triángulo para trilateración) -->
  <!-- B1: esquina NO (0.5, 0.5) → px (60, 60) minor=1 -->
  <rect x="48" y="22" width="24" height="14" rx="3"
        fill="#185FA5" opacity="0.9"/>
  <text x="60" y="32" font-size="8" fill="white"
        text-anchor="middle" font-family="sans-serif">BLE 1</text>

  <!-- B2: esquina NE (4.5, 0.5) → px (460, 60) minor=2 -->
  <rect x="448" y="22" width="24" height="14" rx="3"
        fill="#185FA5" opacity="0.9"/>
  <text x="460" y="32" font-size="8" fill="white"
        text-anchor="middle" font-family="sans-serif">BLE 2</text>

  <!-- B3: centro sur (2.5, 4.0) → px (260, 410) minor=3 -->
  <rect x="248" y="395" width="24" height="14" rx="3"
        fill="#185FA5" opacity="0.9"/>
  <text x="260" y="405" font-size="8" fill="white"
        text-anchor="middle" font-family="sans-serif">BLE 3</text>

  <!-- Título y metadata del mapa -->
  <text x="250" y="530" font-size="12" fill="#444441"
        text-anchor="middle" font-family="sans-serif"
        font-weight="500">Cuarto de prueba 5m x 5m</text>
  <text x="250" y="545" font-size="10" fill="#888780"
        text-anchor="middle" font-family="sans-serif">
    escala: 100px/m | nodos: verdes | beacons BLE: azules
  </text>

</svg>
